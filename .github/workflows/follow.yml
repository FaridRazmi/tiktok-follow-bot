name: TikTok Follow Bot

on:
  schedule:
    - cron: "0 2 * * *"   # 10:00 MYT
    - cron: "0 5 * * *"   # 13:00 MYT
    - cron: "0 8 * * *"   # 16:00 MYT
    - cron: "0 12 * * *"  # 20:00 MYT
  workflow_dispatch: {}

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          pip install requests
          npm init -y
          npm install tiktok-signature
          npx puppeteer browsers install chrome-headless-shell || true
          node -e "const s=require('tiktok-signature'); console.log('tk sig loaded:', typeof s.TikTokSignature)"

      - name: Write cookies
        run: |
          echo "${{ secrets.TIKTOK_COOKIES_JSON }}" | base64 -d > tiktok_cookies.json || echo '[]' > tiktok_cookies.json
          ls -la tiktok_cookies.json

      - name: Run follow batch
        env:
          TIKTOK_COOKIE_HEADER: ${{ secrets.TIKTOK_COOKIE_HEADER }}
          DAILY_LIMIT: "60"
          BATCH_SIZE: "15"
          MIN_DELAY: "75"
          MAX_DELAY: "120"
        run: |
          python3 follow_bot.py 2>&1 | tee run_output.txt

      - name: Commit state (cache/log)
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          git config user.name "tiktok-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "bot: update state $(date -u +%F_%H%M)"
          if [ -n "$BOT_PAT" ]; then
            git push "https://x-access-token:${BOT_PAT}@github.com/FaridRazmi/tiktok-follow-bot.git" HEAD:main
          else
            git push
          fi

      - name: Telegram report
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x tg_report.sh
          ./tg_report.sh "$TG_TOKEN" "$TG_CHAT" run_output.txt